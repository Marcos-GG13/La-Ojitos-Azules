<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24 Puertas · Para ti</title>
  <meta name="description" content="24 sorpresas, una para cada día de diciembre" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ========== SOBRE INICIAL ========== -->
  <div id="envoltorio" class="envoltorio">
    <div class="envoltorio-centro">
      <p class="envoltorio-saludo" id="saludo-sobre">El Melonazo te ha preparado una sorpesita</p>

      <button type="button" class="sobre" id="btn-sobre" aria-label="Abrir el sobre">
        <div class="sobre-fondo"></div>
        
        <div class="carta">

          <p class="carta-para">Hola mi amor,</p>

          <p class="carta-texto">
            Esta va a ser la primera de muchísimas Navidades que vamos a pasar juntitos y tengo muchísimas ganas de hacer un montón de planes navideños contigo mivida.
          </p>

          <p class="carta-texto">
            Y como es nuestra primera Navidad, quería regalarte algo especial para poder recordarte cada día lo muchísimo que te adoro y te amo, y lo feliz y tranquilo que me haces sentir.
          </p>

          <p class="carta-texto">
            Espero que te guste esta sorpresita miamor.
          </p>

          <p class="carta-texto">
            Con infinito cariño y amor,<br>
            - Tu Melón ❤️
          </p>

        </div>

        <div class="sobre-frente">
          <span class="sobre-nombre">Para el amor de mi vida</span>
        </div>
        <div class="sobre-solapa"></div>
        <div class="sobre-lacre">24</div>
      <button
        id="btn-continuar"
        class="btn-continuar oculto"
        type="button">
        Abrir la sorpresita ❤️
      </button>

      <p class="envoltorio-indicacion">Toca el sobre para abrirlo</p>
    </div>
  </div>

  <!-- ========== CALENDARIO ========== -->
  <main id="calendario" class="calendario oculto">
    <header class="cabecera">
      <h1 class="titulo">
        <span class="titulo-palabra">El calendario de adviento</span>
        <span id="nombre-para">del Melón y la Enana 🫪</span>
      </h1>
      <p class="subtitulo">
        24 días de pequeñas sorpresitas para el amor de mi vida ❤️
      </p>
    </header>

    <section class="puertas-contenedor" aria-label="Las 24 puertas">
      <div class="puertas-rejilla" id="rejilla-puertas">
        <!-- Las puertas se generan con JavaScript -->
      </div>
    </section>

    <footer class="pie">
      <p>Tiempo restante para abrir la siguiente puerta</p>
    </footer>

    <div class="cuenta-atras" id="cuenta-atras">
      <div class="tiempo-unidad" id="unidad-dias">
        <span id="cuenta-dias">00</span>
        <small>Días</small>
      </div>

      <div class="tiempo-unidad">
        <span id="cuenta-horas">00</span>
        <small>Horas</small>
      </div>

      <div class="tiempo-unidad">
        <span id="cuenta-minutos">00</span>
        <small>Minutos</small>
      </div>

      <div class="tiempo-unidad">
        <span id="cuenta-segundos">00</span>
        <small>Segundos</small>
      </div>
    </div>
  </main>

  <!-- ========== MODAL DE CONTENIDO ========== -->
  <dialog id="modal" class="modal">
    <div class="modal-contenido">
      <button type="button" class="modal-cerrar" id="btn-cerrar" aria-label="Cerrar">×</button>
      
      <div class="modal-numero" id="modal-numero">1</div>
      
      <div class="modal-cuerpo">
        <img id="modal-foto" class="modal-foto oculto" alt="Foto del día" />
        <p id="modal-texto" class="modal-texto"></p>
      </div>
    </div>
  </dialog>

  <!-- ========== TOAST / MENSAJES ========== -->
  <div id="toast" class="toast oculto"></div>

  <script src="script.js"></script>
</body>
</html>
